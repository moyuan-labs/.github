name: Reusable Content CI

on:
  workflow_call:
    inputs:
      profile:
        description: Content profile, either docs or assets
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Content integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "::error::Unresolved merge marker found."
            exit 1
          fi
      - name: Reject empty tracked media
        if: inputs.profile == 'assets'
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Tracked media file is empty."
              failed=1
            fi
          done < <(find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.svg' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.mp4' -o -iname '*.mov' \) -print0)
          exit "$failed"
