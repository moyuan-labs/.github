name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used by the repository
        required: false
        type: string
        default: "3.12"
      install-command:
        description: Locked dependency installation command
        required: false
        type: string
        default: uv sync --all-groups --frozen
      check-command:
        description: Lint and type-check command; use an empty string to skip
        required: false
        type: string
        default: uv run ruff check .
      test-command:
        description: Test command; use an empty string to skip
        required: false
        type: string
        default: uv run pytest

permissions:
  contents: read

jobs:
  verify:
    name: Python checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Python project
        id: project
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pyproject.toml yet; Python profile is installed but checks are not active."
            exit 0
          fi
          if [[ ! -f uv.lock ]]; then
            echo "::error::pyproject.toml exists but uv.lock is missing."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        if: steps.project.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up uv
        if: steps.project.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        if: steps.project.outputs.enabled == 'true'
        run: ${{ inputs.install-command }}
      - name: Check
        if: steps.project.outputs.enabled == 'true' && inputs.check-command != ''
        run: ${{ inputs.check-command }}
      - name: Test
        if: steps.project.outputs.enabled == 'true' && inputs.test-command != ''
        run: ${{ inputs.test-command }}
