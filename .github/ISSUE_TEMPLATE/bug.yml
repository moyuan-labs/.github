name: Bug report
description: Report a reproducible defect or regression
title: "bug: "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, and where did it happen?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence, inputs, and environment.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, links, or state why evidence is unavailable. Remove credentials and private data.
    validations:
      required: true
